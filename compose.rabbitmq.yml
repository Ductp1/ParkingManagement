services:
  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: parking-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Run scripts/setup-rabbitmq-local.ps1 first}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/setup-rabbitmq-local.ps1 first}
      RABBITMQ_DEFAULT_VHOST: parking
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - parking-rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - type: bind
        source: ./infrastructure/rabbitmq/definitions.local.json
        target: /etc/rabbitmq/definitions.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  parking-rabbitmq-data:
