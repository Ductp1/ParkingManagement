name: CI

# CI cho toÃ n há»‡ thá»‘ng microservice:
#   build           â†’ solution compile Ä‘Æ°á»£c (gá»“m cáº£ project API khÃ´ng cÃ³ test riÃªng)
#   unit-tests      â†’ 9 job song song, má»—i service 1 job (má»—i ngÆ°á»i theo dÃµi service cá»§a mÃ¬nh)
#   integration     â†’ WebApplicationFactory + SQL Server 2022 (service container), DB riÃªng cho tá»«ng service host
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # CI khong co RabbitMQ → tat EventBus cho moi host service (WebApplicationFactory van start duoc).
  EventBus__Enabled: "false"

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ParkingManagement.slnx

      - name: Build
        run: dotnet build ParkingManagement.slnx -c Release --no-restore --nologo

  # XÃ¡c Ä‘á»‹nh service nÃ o cÃ³ code thay Ä‘á»•i Ä‘á»ƒ chá»‰ cháº¡y unit test cá»§a cÃ¡c service Ä‘Ã³.
  # - pull_request: dorny/paths-filter so sÃ¡nh PR vá»›i base branch (dÃ¹ng GitHub API láº¥y danh sÃ¡ch file thay Ä‘á»•i)
  # - push tháº³ng vÃ o main/develop, hoáº·c thay Ä‘á»•i code dÃ¹ng chung (BuildingBlocks, Directory.Build.props,
  #   solution, CI workflow) â†’ cháº¡y unit test cá»§a Táº¤T Cáº¢ service (giá»¯ hÃ nh vi an toÃ n nhÆ° cÅ©)
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      # JSON dÃ¹ng lÃ m dynamic matrix cho job unit-tests, vÃ­ dá»¥: {"service":["UserService"]}
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            UserService:
              - 'Services/UserService/**'
            VehicleService:
              - 'Services/VehicleService/**'
            ParkingService:
              - 'Services/ParkingService/**'
            BookingService:
              - 'Services/BookingService/**'
            PaymentService:
              - 'Services/PaymentService/**'
            NotificationService:
              - 'Services/NotificationService/**'
            GateService:
              - 'Services/GateService/**'
            AdminService:
              - 'Services/AdminService/**'
            SupportService:
              - 'Services/SupportService/**'
            # Code/áº£nh hÆ°á»Ÿng dÃ¹ng chung cho má»i service
            shared:
              - 'BuildingBlocks/**'
              - 'Directory.Build.props'
              - 'ParkingManagement.slnx'
              - '.github/workflows/ci.yml'

      - name: Build unit-test matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_SERVICES: ${{ steps.filter.outputs.changes }}   # JSON array, vd: ["UserService"]
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}      # "true" náº¿u code dÃ¹ng chung thay Ä‘á»•i
        run: |
          ALL='["UserService","VehicleService","ParkingService","BookingService","PaymentService","NotificationService","GateService","AdminService","SupportService"]'
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$SHARED_CHANGED" != "true" ]; then
            # PR chá»‰ Ä‘á»¥ng service cá»¥ thá»ƒ â†’ chá»‰ test cÃ¡c service Ä‘Ã³
            services="{\"service\":${CHANGED_SERVICES:-[]}}"
          else
            services="{\"service\":$ALL}"
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit tests â€“ ${{ matrix.service }}
    needs: [build, changes]
    runs-on: ubuntu-latest
    environment: environment

    # US-066: GateService.Test cÃ³ 3 test cháº¡y trÃªn PostgreSQL tháº­t (LotAdmissionGateDbTests â€“
    # kiá»ƒm chá»©ng row-lock chá»‘ng race condition, khÃ´ng thá»ƒ giáº£ láº­p trÃªn InMemory). Job matrix
    # dÃ¹ng chung nÃªn cÃ¡c service khÃ¡c cÅ©ng cÃ³ sáºµn postgres (vÃ´ háº¡i â€“ khÃ´ng dÃ¹ng tá»›i).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      Vnpay__HashSecret: ${{ secrets.VNPAY__HASHSECRET }}
      # T-704: secret HMAC xÃ¡c thá»±c QR token check-in (BookingService â†” GateService). CÃ¹ng tÃªn vá»›i biáº¿n mÃ´i trÆ°á»ng local.
      QRTOKEN_SECRET: ${{ secrets.QRTOKEN_SECRET }}
    strategy:
      fail-fast: false                       # 1 service Ä‘á» khÃ´ng há»§y service khÃ¡c
      # Matrix Ä‘á»™ng tá»« job "changes": PR chá»‰ Ä‘á»•i service nÃ o thÃ¬ chá»‰ cháº¡y unit test service Ä‘Ã³.
      # Matrix rá»—ng (PR khÃ´ng Ä‘á»¥ng service nÃ o) â†’ job nÃ y tá»± skip. Push tháº³ng/code dÃ¹ng chung â†’ cháº¡y táº¥t cáº£.
      matrix: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Unit test â€“ Ä‘a sá»‘ khÃ´ng cáº§n database; riÃªng GateService cÃ³ 3 test US-066 cháº¡y trÃªn
      # PostgreSQL tháº­t tá»« service container postgres khai bÃ¡o á»Ÿ trÃªn (localhost:5432).
      - name: Test
        run: >
          dotnet test Services/${{ matrix.service }}/${{ matrix.service }}.Test/${{ matrix.service }}.Test.csproj
          -c Release --nologo
          --logger "trx;LogFileName=${{ matrix.service }}.trx"
          --results-directory ./test-results
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.service }}
          path: ./test-results
          retention-days: 14

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    env:
      # T-704: GateService Ä‘á»c secret QR token tá»« biáº¿n mÃ´i trÆ°á»ng â€“ sáºµn sÃ ng khi GateService Ä‘Æ°á»£c
      # thÃªm vÃ o integration test. LÆ°u Ã½: secret pháº£i lÃ  repository/organization secret
      # (job nÃ y khÃ´ng khai bÃ¡o `environment:` nÃªn khÃ´ng tháº¥y environment-scoped secrets).
      QRTOKEN_SECRET: ${{ secrets.QRTOKEN_SECRET }}

    # PostgreSQL tháº­t cho integration test (WebApplicationFactory â†’ PostgreSQL qua localhost:5432)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Táº¡o sáºµn DB riÃªng cho tá»«ng service host (má»—i DbContext cÃ³ báº£ng __EFMigrationsHistory riÃªng,
      # dÃ¹ng chung 1 DB sáº½ xung Ä‘á»™t migration). Provider Npgsql khÃ´ng tá»± táº¡o database khi Migrate.
      - name: Prepare databases
        run: |
          cid=$(docker ps -q --filter "ancestor=postgres:17-alpine" | head -n1)
          docker exec "$cid" psql -U postgres -c "CREATE DATABASE pm_parking_ci;"
          docker exec "$cid" psql -U postgres -c "CREATE DATABASE pm_booking_ci;"
          docker exec "$cid" psql -U postgres -c "CREATE DATABASE pm_user_ci;"

      # Ghi Ä‘Ã¨ ConnectionStrings:ServiceDb báº±ng biáº¿n mÃ´i trÆ°á»ng (Æ°u tiÃªn cao hÆ¡n appsettings.json)
      - name: Test â€“ UserService (pm_user_ci)
        env:
          TV1_TEST_DB: "Host=localhost;Port=5432;Database=pm_user_ci;Username=postgres;Password=postgres"
        run: >
          dotnet test Tests/ParkingManagement.IntegrationTests/ParkingManagement.IntegrationTests.csproj
          -c Release --nologo
          --filter "FullyQualifiedName~UserServiceApiTests"
          --logger "trx;LogFileName=Integration_User.trx"
          --results-directory ./test-results

      - name: Test â€“ ParkingService (pm_parking_ci)
        env:
          ConnectionStrings__ServiceDb: "Host=localhost;Port=5432;Database=pm_parking_ci;Username=postgres;Password=postgres"
        run: >
          dotnet test Tests/ParkingManagement.IntegrationTests/ParkingManagement.IntegrationTests.csproj
          -c Release --nologo
          --filter "FullyQualifiedName~ParkingServiceApiTests"
          --logger "trx;LogFileName=Integration_Parking.trx"
          --results-directory ./test-results

      - name: Test â€“ BookingService (pm_booking_ci)
        env:
          ConnectionStrings__ServiceDb: "Host=localhost;Port=5432;Database=pm_booking_ci;Username=postgres;Password=postgres"
        run: >
          dotnet test Tests/ParkingManagement.IntegrationTests/ParkingManagement.IntegrationTests.csproj
          -c Release --nologo
          --filter "FullyQualifiedName~BookingServiceApiTests"
          --logger "trx;LogFileName=Integration_Booking.trx"
          --results-directory ./test-results

      # Test â€“ 6 suite per-service cÃ²n láº¡i (Vehicle, Payment, Notification, Gate, Admin, Support).
      # Má»—i suite tá»± táº¡o database pm_it_* riÃªng rá»“i tá»± xÃ³a khi cháº¡y xong, nÃªn khÃ´ng cáº§n táº¡o sáºµn DB á»Ÿ "Prepare databases"
      # (connection string dÆ°á»›i Ä‘Ã¢y chá»‰ dÃ¹ng host/port/user/password; tÃªn database bá»‹ fixture ghi Ä‘Ã¨).
      - name: Test â€“ Per-service suites (Vehicle/Payment/Notification/Gate/Admin/Support)
        env:
          ConnectionStrings__ServiceDb: "Host=localhost;Port=5432;Database=pm_booking_ci;Username=postgres;Password=postgres"
        run: >
          dotnet test Tests/ParkingManagement.IntegrationTests/ParkingManagement.IntegrationTests.csproj
          -c Release --nologo
          --filter "FullyQualifiedName~IntegrationTests.PerService"
          --logger "trx;LogFileName=Integration_PerService.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results
          retention-days: 14
