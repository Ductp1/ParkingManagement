name: CD

# CD – chạy khi push tag phiên bản (vd: v1.0.0):
#   build-and-push → build & push 10 image Docker (9 service + Gateway) lên GHCR, tag theo phiên bản
#   release        → tạo GitHub Release kèm danh sách image
# Chạy tay được (workflow_dispatch) để rebuild lại image mà không cần tag mới.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write     # tạo GitHub Release
  packages: write     # push lên GHCR

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Docker – ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: user-service
            dockerfile: Services/UserService/UserService.API/Dockerfile
          - image: vehicle-service
            dockerfile: Services/VehicleService/VehicleService.API/Dockerfile
          - image: parking-service
            dockerfile: Services/ParkingService/ParkingService.API/Dockerfile
          - image: booking-service
            dockerfile: Services/BookingService/BookingService.API/Dockerfile
          - image: payment-service
            dockerfile: Services/PaymentService/PaymentService.API/Dockerfile
          - image: notification-service
            dockerfile: Services/NotificationService/NotificationService.API/Dockerfile
          - image: gate-service
            dockerfile: Services/GateService/GateService.API/Dockerfile
          - image: admin-service
            dockerfile: Services/AdminService/AdminService.API/Dockerfile
          - image: support-service
            dockerfile: Services/SupportService/SupportService.API/Dockerfile
          - image: gateway
            dockerfile: Gateway/ParkingManagement.Gateway/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # GHCR yêu cầu tên image viết thường → lowercase owner/repo một lần ở đây
      - name: Compute image prefix
        id: prefix
        run: echo "prefix=${REGISTRY,,}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prefix.outputs.prefix }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .                                # context = gốc repo (Dockerfile copy BuildingBlocks)
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker images – `ghcr.io/${{ github.repository }}`

            Cả 10 image được tag với phiên bản này: `user-service`, `vehicle-service`, `parking-service`,
            `booking-service`, `payment-service`, `notification-service`, `gate-service`, `admin-service`,
            `support-service`, `gateway`.

            Pull example:
            ```bash
            docker pull ghcr.io/${{ github.repository }}/parking-service:${{ github.ref_name }}
            ```

            Service containers cần biến môi trường `ConnectionStrings__ServiceDb`
            (xem `BuildingBlocks/ParkingManagement.ServiceDefaults/ServiceDefaultsExtensions.cs`).